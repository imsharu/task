<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPC UA Tag Data</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>OPC UA Tag Data (Updated Every 500ms)</h1>
  <table id="tagTable">
    <thead>
      <tr>
        <th>Tag ID</th>
        <th>Value</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <script>
    function updateTable() {
      // Fetch the latest tag values from the API endpoint with a cache-busting timestamp
      fetch('/api/tag-values?t=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
          const tbody = document.querySelector("#tagTable tbody");
          tbody.innerHTML = "";
          data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${item[0]}</td>
                             <td>${item[1]}</td>
                             <td>${item[2]}</td>`;
            tbody.appendChild(row);
          });
        })
        .catch(err => console.error("Error fetching tag values:", err));
    }
    // Update the table every 500ms
    setInterval(updateTable, 500);
    updateTable();
  </script>
</body>
</html>
