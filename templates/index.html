<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPC UA Tag Group Data</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>OPC UA Tag Group Data (updated every 1 second)</h1>
  <table id="tagTable">
    <thead>
      <tr>
        <th>Grp</th>
        <th>Tag1 NodeId</th>
        <th>Tag1 Name</th>
        <th>Tag1 Value</th>
        <th>Tag1 SR</th>
        <th>Tag2 NodeId</th>
        <th>Tag2 Name</th>
        <th>Tag2 Value</th>
        <th>Tag2 SR</th>
        <th>Timestamp</th>
        <th>Grp SR</th>
        <th>CPU (%)</th>
        <th>Mem (%)</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <script>
    function updateTable() {
      fetch('/api/tag-values')
        .then(response => response.json())
        .then(data => {
          const tbody = document.querySelector("#tagTable tbody");
          tbody.innerHTML = "";
          data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${item[0]}</td>
                             <td>${item[1]}</td>
                             <td>${item[2]}</td>
                             <td>${item[3]}</td>
                             <td>${item[4]}</td>
                             <td>${item[5]}</td>
                             <td>${item[6]}</td>
                             <td>${item[7]}</td>
                             <td>${item[8]}</td>
                             <td>${item[9]}</td>
                             <td>${item[10]}</td>
                             <td>${item[11]}</td>
                             <td>${item[12]}</td>`;
            tbody.appendChild(row);
          });
        })
        .catch(err => console.error("Error fetching tag values:", err));
    }
    // Update table every 1 second
    setInterval(updateTable, 1000);
    updateTable();
  </script>
</body>
</html>
